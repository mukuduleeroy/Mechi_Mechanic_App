name: mechi
description: Mechi driver application for automotive assistance.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.5.0
  flutter_svg: ^2.2.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  dio: ^5.11.1
  file_picker: ^13.4.1
  geolocator: ^14.1.2
  socket_io_client: 3.1.4
  firebase_messaging: 17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vehicles/
    - assets/branding/
    - assets/icons/
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
